<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Таймер пар ЛьвДУВС</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- Час і дата -->
<div id="top-bar">
  <div id="clock"></div>
  <div id="date"></div>
</div>

<!-- Кнопка налаштувань -->
<div class="settings">
  <button id="settingsBtn">⚙️</button>
  <div class="settings-menu" id="settingsMenu">
    <p>🎨 Колір фону:</p>
    <button class="color-option" data-color="#d32f2f">Червоний</button>
    <button class="color-option" data-color="#2e7d32">Зелений</button>
    <button class="color-option" data-color="#6a1b9a">Фіолетовий</button>
    <button class="color-option" data-color="#1976d2">Синій</button>
    <button id="autoColor">Авто</button>
    <hr />
    <button onclick="location.href='editor.html'">📚 Редагувати пари</button>
  </div>
</div>

<!-- Таймер -->
<div class="timer-container">
  <h1 id="pairName">Завантаження...</h1>
  <div id="timer">00:00:00</div>
</div>

<!-- 🔒 ПЕРЕВІРКА АВТОРИЗАЦІЇ -->
<script type="module" src="auth-check.js"></script>

<!-- ОСНОВНИЙ СКРИПТ -->
<script src="script.js"></script>

</body>
</html>
