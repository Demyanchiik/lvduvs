<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ЛьвДУВС Таймер пар</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ⏰ Поточний час -->
  <div id="clock"></div>

  <!-- ⚙️ Налаштування -->
  <div class="settings">
    <button id="settingsBtn">⚙️</button>

    <div class="settings-menu" id="settingsMenu">

      <!-- 🎨 Кольори -->
      <div class="section">
        <p>🎨 Колір:</p>
        <button class="color-option red" data-color="#d32f2f">Пари</button>
        <button class="color-option green" data-color="#2e7d32">Перерва</button>
        <button class="color-option purple" data-color="#6a1b9a">Обід</button>
        <button class="color-option blue" data-color="#1976d2">Немає пар</button>
        <button class="reset">Авто режим</button>
      </div>

      <!-- ☑️ Пари -->
      <div class="section">
        <p>📚 Активні пари:</p>

        <label><input type="checkbox" data-id="0" checked> 1 пара</label>
        <label><input type="checkbox" data-id="2" checked> 2 пара</label>
        <label><input type="checkbox" data-id="4" checked> 3 пара</label>
        <label><input type="checkbox" data-id="6" checked> 4 пара</label>

      </div>

    </div>
  </div>

  <div class="timer-container">
    <h1>ЛьвДУВС Таймер пар</h1>
    <div class="current-session" id="current-session">Завантаження...</div>
    <div class="timer" id="timer">00:00:00</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
